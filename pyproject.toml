[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentvow"
version = "0.1.0"
description = "Check a coding agent's claims against the repository before you approve."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ai-agents", "verification", "code-review", "copilot", "claude-code", "hooks"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/NavikkumarModi/Agentvow"
Issues = "https://github.com/NavikkumarModi/Agentvow/issues"

[project.scripts]
agentvow = "agentvow.cli:run"

[tool.setuptools]
packages = ["agentvow"]
