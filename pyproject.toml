[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmirror"
version = "0.1.0"
description = "Check a coding agent's claims against the repository before you approve."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agentmirror = "agentmirror.cli:run"

[tool.setuptools]
packages = ["agentmirror"]
