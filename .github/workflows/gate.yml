# Agentvow gate: a REUSABLE workflow. It checks out the pull request, replays its tests in Agentvow's sandbox, builds a minimal receipt, evaluates it under the policy from the BASE branch, and
# (optionally) posts the receipt to a control plane that authenticates this run with GitHub's OIDC token. Call it from a pull_request workflow:
#
#   permissions: { contents: read, id-token: write }     # id-token only if you set service-url
#   jobs:
#     gate:
#       uses: NavikkumarModi/Agentvow/.github/workflows/gate.yml@<a release tag or commit>
#       with: { fail-on: block }
#
# Pin the reference: a receipt is trusted by the service only when the OIDC claim `job_workflow_ref` names THIS workflow at a pinned ref, so a workflow the pull request itself wrote cannot post one.
# This RUNS THE PULL REQUEST'S CODE (sandboxed, no tokens passed in); see docs/GATE_WORKFLOW.md. Needs an Agentvow release that has `receipt` and `policy` (0.4.0 or later).
name: agentvow-gate
on:
  workflow_call:
    inputs:
      agentvow-version:
        description: "Agentvow version installed from PyPI (an exact version)"
        type: string
        default: "0.4.0"
      install-from-checkout:
        description: "Install Agentvow from the checked-out repository instead of PyPI (for this repository's own tests of the workflow)"
        type: boolean
        default: false
      service-url:
        description: "Base URL of the control plane. Empty: no upload; the policy is evaluated locally only"
        type: string
        default: ""
      audience:
        description: "Audience of the OIDC token requested for the control plane"
        type: string
        default: "agentvow-control-plane"
      policy-path:
        description: "Policy file in the BASE branch (never read from the pull request)"
        type: string
        default: ".agentvow/policy.json"
      test-timeout:
        description: "Seconds allowed for each test run (a whole number)"
        type: string
        default: "900"
      test-command:
        description: "Optional --test-cmd for Agentvow, e.g. '{py} -m pytest -q tests'"
        type: string
        default: ""
      fail-on:
        description: "block (default): fail only when the policy blocks; needs_acknowledgement: also fail when a person must acknowledge; never: report only"
        type: string
        default: "block"
    outputs:
      decision:
        description: "allow | needs_acknowledgement | block (the local policy evaluation)"
        value: ${{ jobs.gate.outputs.decision }}
      service-decision:
        description: "The control plane's decision, when service-url was set"
        value: ${{ jobs.gate.outputs.service-decision }}
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # only used to ask GitHub for an OIDC token when service-url is set; the caller's job must grant it too
    outputs:
      decision: ${{ steps.policy.outputs.decision }}
      service-decision: ${{ steps.upload.outputs.service-decision }}
    steps:
      - name: Refuse to run the pull request's code in an unsafe place
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          TEST_TIMEOUT: ${{ inputs.test-timeout }}
          FAIL_ON: ${{ inputs.fail-on }}
        run: |
          case "$EVENT" in pull_request|push|workflow_dispatch) ;; *) echo "The gate runs the pull request's code and is refused on the '$EVENT' event (use pull_request, push or workflow_dispatch)."; exit 1;; esac
          case "$TEST_TIMEOUT" in ''|*[!0-9]*) echo "test-timeout must be a whole number of seconds."; exit 1;; esac
          case "$FAIL_ON" in block|needs_acknowledgement|never) ;; *) echo "fail-on must be block, needs_acknowledgement or never."; exit 1;; esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Install Agentvow
        shell: bash
        env:
          VERSION: ${{ inputs.agentvow-version }}
          FROM_CHECKOUT: ${{ inputs.install-from-checkout }}
        run: |
          if [ "$FROM_CHECKOUT" = "true" ]; then python -m pip install --quiet .; else python -m pip install --quiet "agentvow==$VERSION"; fi
          agentvow --version
      - name: Linux sandbox prerequisites (bubblewrap, user namespaces)
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "could not change the AppArmor setting; the sandbox may be unavailable"
      - name: Replay the tests and build the receipt (no token of any kind is passed to this step)
        id: check
        shell: bash
        env:
          CLAIM: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TEST_TIMEOUT: ${{ inputs.test-timeout }}
          TEST_COMMAND: ${{ inputs.test-command }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/gate"
          printf '%s' "$CLAIM" > "$RUNNER_TEMP/gate/claim.txt"
          ARGS=()
          if [ -n "$TEST_COMMAND" ]; then ARGS=(--test-cmd "$TEST_COMMAND"); fi
          # the OIDC and runtime tokens exist only in the environment of the steps that need them: remove every credential-like variable here as defence in depth
          env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_RUNTIME_URL -u GITHUB_TOKEN \
            agentvow check --repo . ${BASE_SHA:+--base "$BASE_SHA"} --transcript "$RUNNER_TEMP/gate/claim.txt" --evidence-pack --test-timeout "$TEST_TIMEOUT" "${ARGS[@]}" --json > "$RUNNER_TEMP/gate/decision.json"
          echo "check_exit=$?" >> "$GITHUB_OUTPUT"
          env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_RUNTIME_URL -u GITHUB_TOKEN \
            agentvow receipt --decision "$RUNNER_TEMP/gate/decision.json" --repo-slug "$REPO_SLUG" --repo . ${BASE_SHA:+--base "$BASE_SHA"} -o "$RUNNER_TEMP/gate/receipt.json"
          echo "receipt_exit=$?" >> "$GITHUB_OUTPUT"
      - name: Evaluate the policy from the base branch
        id: policy
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          POLICY_PATH: ${{ inputs.policy-path }}
        run: |
          set +e
          POL=()
          if [ -n "$BASE_REF" ] && git fetch --quiet origin "$BASE_REF" 2>/dev/null && git show "origin/$BASE_REF:$POLICY_PATH" > "$RUNNER_TEMP/gate/policy.json" 2>/dev/null; then
            POL=(--policy "$RUNNER_TEMP/gate/policy.json"); echo "Policy: $POLICY_PATH from origin/$BASE_REF"
          else
            echo "No policy file in the base branch: the default policy applies (contradicted blocks; unknown needs acknowledgement)."
          fi
          if [ ! -s "$RUNNER_TEMP/gate/receipt.json" ]; then echo "decision=block" >> "$GITHUB_OUTPUT"; echo "No receipt was produced; treating as block."; exit 0; fi
          agentvow policy evaluate "${POL[@]}" --receipt "$RUNNER_TEMP/gate/receipt.json" > "$RUNNER_TEMP/gate/result.json"
          DEC=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['decision'])" "$RUNNER_TEMP/gate/result.json")
          echo "decision=$DEC" >> "$GITHUB_OUTPUT"
          python - "$RUNNER_TEMP/gate/result.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print(f"## Agentvow gate: {r['decision']}\n")
          for x in r["reasons"]:
              print(f"- **{x['rule']}** ({x['outcome']}{', acknowledged by ' + x['acknowledged_by'] if x['acknowledged_by'] else ''}): {x['text']}")
          print("\nA pass here is evidence to weigh, not verification: the pull request's own code wrote the test output.")
          PY
      - name: Post the receipt to the control plane (only when service-url is set)
        id: upload
        if: ${{ inputs.service-url != '' }}
        shell: bash
        env:
          SERVICE_URL: ${{ inputs.service-url }}
          AUDIENCE: ${{ inputs.audience }}
        run: |
          set +e
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then echo "No OIDC token is available: the calling job needs 'permissions: id-token: write'."; echo "service-decision=error" >> "$GITHUB_OUTPUT"; exit 0; fi
          TOKEN=$(curl -sS --max-time 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | python -c "import json,sys;print(json.load(sys.stdin)['value'])")
          [ -n "$TOKEN" ] && echo "::add-mask::$TOKEN"
          RESP=$(curl -sS --max-time 30 -X POST "$SERVICE_URL/v1/receipts" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "@$RUNNER_TEMP/gate/receipt.json")
          echo "$RESP" > "$RUNNER_TEMP/gate/service.json"
          DEC=$(python -c "import json,sys;d=json.load(open(sys.argv[1]));print(d.get('decision',{}).get('decision') or 'error')" "$RUNNER_TEMP/gate/service.json" 2>/dev/null || echo error)
          echo "service-decision=$DEC" >> "$GITHUB_OUTPUT"
          echo "Control plane answered: $DEC"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentvow-receipt
          path: ${{ runner.temp }}/gate/receipt.json
      - name: Apply fail-on
        shell: bash
        env:
          DECISION: ${{ steps.policy.outputs.decision }}
          SERVICE_DECISION: ${{ steps.upload.outputs.service-decision }}
          FAIL_ON: ${{ inputs.fail-on }}
        run: |
          # the stricter of the local evaluation and the control plane's answer; an error counts as block
          D=$(python -c "import sys;r={'allow':0,'needs_acknowledgement':1,'block':2,'error':2};a,b=sys.argv[1],sys.argv[2];c=[x for x in (a,b) if x];print(max(c,key=lambda x:r.get(x,2)) if c else 'block')" "$DECISION" "$SERVICE_DECISION")
          echo "effective decision: $D"
          case "$FAIL_ON" in
            never) exit 0 ;;
            needs_acknowledgement) [ "$D" = "allow" ] || exit 1 ;;
            *) [ "$D" = "block" ] || [ "$D" = "error" ] && exit 1 ;;
          esac
          exit 0
