name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Linux sandbox prerequisites (bubblewrap, user namespaces)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-net --dev /dev true && echo "bwrap works"
      - name: Test tools
        run: |
          python -m pip install -q pytest pyyaml
          git config --global user.email ci@example.com && git config --global user.name ci
          git config --global init.defaultBranch main
      - name: Python tests
        run: python -m unittest discover -s tests
      - name: Node tests
        run: node --test vscode/test/extension.test.js vscode/test/helpers.test.js
      - name: Doctor
        run: python -m agentmirror.cli doctor --repo . || true
