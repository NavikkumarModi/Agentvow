name: "AgentMirror"
description: "Check what an AI agent's pull request says it did against what is in the repository. Informs reviewers; never approves or merges."
inputs:
  claim-text:
    description: "The agent's claim text. Default: the pull request description."
    required: false
    default: ""
  base:
    description: "Base ref to compare with. Default: the pull request base."
    required: false
    default: ""
  fail-on:
    description: "Fail the job when the verdict is: none | review | insufficient"
    required: false
    default: "none"
  comment:
    description: "Post or update a pull request comment (needs pull-requests: write)"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install AgentMirror
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: Check the claim against the repository
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CLAIM_INPUT: ${{ inputs.claim-text }}
        PR_BODY: ${{ github.event.pull_request.body }}
        BASE_INPUT: ${{ inputs.base }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set +e
        mkdir -p "$RUNNER_TEMP/agentmirror"
        if [ -n "$CLAIM_INPUT" ]; then printf '%s' "$CLAIM_INPUT" > "$RUNNER_TEMP/agentmirror/claim.txt"; else printf '%s' "$PR_BODY" > "$RUNNER_TEMP/agentmirror/claim.txt"; fi
        BASE="${BASE_INPUT:-$BASE_SHA}"
        agentmirror check --repo . ${BASE:+--base "$BASE"} --transcript "$RUNNER_TEMP/agentmirror/claim.txt" \
          --ci ${HEAD_SHA:+--ci-sha "$HEAD_SHA"} \
          --html "$RUNNER_TEMP/agentmirror/report.html" --markdown "$RUNNER_TEMP/agentmirror/summary.md" > /dev/null
        echo "code=$?" >> "$GITHUB_OUTPUT"
        cat "$RUNNER_TEMP/agentmirror/summary.md" >> "$GITHUB_STEP_SUMMARY"
        echo "report=$RUNNER_TEMP/agentmirror/report.html" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      with:
        name: agentmirror-report
        path: ${{ runner.temp }}/agentmirror/report.html
    - name: Post or update the pull request comment
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        MARK='<!-- agentmirror-report -->'
        # update only OUR previous comment (identified by the marker and the workflow's own bot account), never someone else's last comment
        ID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | contains(\"$MARK\")) | .id" 2>/dev/null | head -1)
        if [ -n "$ID" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F "body=@$RUNNER_TEMP/agentmirror/summary.md" > /dev/null \
            || echo "Could not update the comment; the summary is in the job summary."
        else
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/agentmirror/summary.md" \
            || echo "Could not post the comment (missing pull-requests: write, or a fork). The summary is in the job summary."
        fi
    - name: Apply fail-on
      shell: bash
      env:
        CODE: ${{ steps.check.outputs.code }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        case "$FAIL_ON" in
          review) [ "$CODE" = "1" ] && exit 1 ;;
          insufficient) [ "$CODE" = "1" ] || [ "$CODE" = "2" ] && exit 1 ;;
        esac
        [ "$CODE" = "3" ] && { echo "AgentMirror tool error"; exit 1; }
        exit 0
